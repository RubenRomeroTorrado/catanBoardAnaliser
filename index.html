<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablero de Catan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🗺️ Tablero de Catan</h1>
        <p>Haz clic en un hexágono para asignarle un número del 2 al 12 (el 7 no se usa).</p>
        
        <!-- Leyenda dinámica donde aparecerán los selectores de color -->
        <div class="legend" id="legendContainer"></div>

        <!-- Botón para reiniciar -->
        <button id="resetButton" class="btn-reset">🔄 Reiniciar Tablero</button>

        <canvas id="boardCanvas"></canvas>
    </div>
    <script src="script.js"></script>
</body>
</html>
